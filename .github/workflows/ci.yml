name: CI

on:
  push:
    branches:
      - main

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Show Failure Message
        if: failure()
        run: echo "Test Failed"

      - name: Create a test report
        if: always()
        run: |
          echo "Test Completed" > test-result.txt
      
      - name: Generate image tag
        id: version
        run: echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"  #special environment variable of github 
      
      - name: show tag name
        run: echo "Tag is ${{ steps.version.outputs.tag }}"


      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-result.txt

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t githubactions-demo:v1 .